<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Sofia Sans, Helvetica, Arial, sans-serif">
  <title>Imali AI for Alexa+: how the pieces connect</title>
  <rect width="1200" height="640" fill="#f3f0ee"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cf4500"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#696969"/></marker>
  </defs>

  <text x="40" y="54" font-size="28" font-weight="600" fill="#141413">Imali AI for Alexa+</text>
  <text x="40" y="82" font-size="16" fill="#696969">The owner talks; an agent picks MCP tools; the server's code keeps the books in whole cents.</text>

  <!-- the simulated Alexa+ screen -->
  <rect x="40" y="112" width="330" height="300" rx="26" fill="#fcfbfa" stroke="#e4dfda"/>
  <circle cx="64" cy="140" r="5" fill="#cf4500"/>
  <text x="78" y="145" font-size="13" font-weight="700" letter-spacing="1" fill="#696969">SIMULATED ALEXA+ SCREEN</text>
  <text x="62" y="178" font-size="17" font-weight="600" fill="#141413">Browser page (web/)</text>
  <text x="62" y="206" font-size="15" fill="#262627">Speech in and spoken replies</text>
  <text x="62" y="230" font-size="15" fill="#262627">MCP client: official TypeScript SDK</text>
  <text x="62" y="254" font-size="15" fill="#262627">MCP Apps host: cards in a sandbox</text>
  <text x="62" y="278" font-size="15" fill="#262627">Confirmation sheet for elicitation</text>
  <text x="62" y="302" font-size="15" fill="#262627">Figures check on every reply</text>
  <rect x="62" y="326" width="286" height="62" rx="14" fill="#fbe3d4"/>
  <text x="78" y="352" font-size="14" font-weight="600" fill="#7a2e06">Agent model, any OpenAI-compatible</text>
  <text x="78" y="373" font-size="14" fill="#7a2e06">endpoint, through a small relay</text>

  <!-- other hosts -->
  <rect x="40" y="440" width="330" height="96" rx="22" fill="#fcfbfa" stroke="#e4dfda"/>
  <text x="62" y="474" font-size="17" font-weight="600" fill="#141413">Any other MCP host</text>
  <text x="62" y="500" font-size="15" fill="#262627">e.g. Claude Code over HTTP;</text>
  <text x="62" y="522" font-size="15" fill="#262627">the Agent Skill in skills/ guides it</text>

  <!-- protocol arrows -->
  <line x1="372" y1="230" x2="512" y2="230" stroke="#cf4500" stroke-width="3" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="380" y="214" font-size="13" font-weight="700" fill="#cf4500">MCP 2025-11-25</text>
  <text x="380" y="256" font-size="13" fill="#696969">Streamable HTTP</text>
  <text x="380" y="274" font-size="13" fill="#696969">tools, resources,</text>
  <text x="380" y="292" font-size="13" fill="#696969">elicitation</text>
  <line x1="372" y1="488" x2="512" y2="370" stroke="#cf4500" stroke-width="3" marker-end="url(#arr)"/>

  <!-- the server -->
  <rect x="514" y="112" width="330" height="424" rx="26" fill="#ffffff" stroke="#e4dfda"/>
  <circle cx="538" cy="140" r="5" fill="#cf4500"/>
  <text x="552" y="145" font-size="13" font-weight="700" letter-spacing="1" fill="#696969">IMALI AI MCP SERVER (src/)</text>
  <text x="536" y="180" font-size="15" font-weight="600" fill="#141413">13 tools with structured output</text>
  <text x="536" y="203" font-size="14" fill="#262627">record_sale · record_stock_received</text>
  <text x="536" y="223" font-size="14" fill="#262627">record_expense · record_tab_payment</text>
  <text x="536" y="243" font-size="14" fill="#262627">get_day_summary · get_customer_tabs</text>
  <text x="536" y="263" font-size="14" fill="#262627">get_stock · close_day · reorder_stock …</text>
  <text x="536" y="297" font-size="15" font-weight="600" fill="#141413">MCP Apps views</text>
  <text x="536" y="320" font-size="14" fill="#262627">ui://imali-ai/card.html · stock.html</text>
  <text x="536" y="354" font-size="15" font-weight="600" fill="#141413">Elicitation before a purchase order</text>
  <text x="536" y="388" font-size="15" font-weight="600" fill="#141413">Prompts: close_the_day, morning_check</text>
  <rect x="536" y="410" width="286" height="104" rx="16" fill="#e7f1ea"/>
  <text x="552" y="438" font-size="15" font-weight="600" fill="#1d7a4a">The ledger (src/ledger.js)</text>
  <text x="552" y="461" font-size="14" fill="#1d7a4a">Double entry in whole cents</text>
  <text x="552" y="482" font-size="14" fill="#1d7a4a">Refuses any entry that does not balance</text>
  <text x="552" y="503" font-size="14" fill="#1d7a4a">The model never writes a figure</text>

  <!-- storage arrow -->
  <line x1="846" y1="460" x2="954" y2="460" stroke="#696969" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="858" y="448" font-size="13" fill="#696969">books per shop</text>

  <!-- where it runs -->
  <rect x="956" y="112" width="204" height="232" rx="26" fill="#fcfbfa" stroke="#e4dfda"/>
  <text x="976" y="146" font-size="13" font-weight="700" letter-spacing="1" fill="#696969">ON AWS (us-east-1)</text>
  <text x="976" y="180" font-size="15" font-weight="600" fill="#141413">Bedrock AgentCore</text>
  <text x="976" y="200" font-size="15" font-weight="600" fill="#141413">Runtime</text>
  <text x="976" y="222" font-size="13" fill="#262627">ARM64 container, MCP</text>
  <text x="976" y="240" font-size="13" fill="#262627">microVM per session</text>
  <text x="976" y="272" font-size="15" font-weight="600" fill="#141413">Amazon Cognito</text>
  <text x="976" y="292" font-size="13" fill="#262627">JWT sign-in</text>
  <text x="976" y="322" font-size="13" fill="#262627">Images in Amazon ECR</text>

  <rect x="956" y="370" width="204" height="166" rx="26" fill="#fcfbfa" stroke="#e4dfda"/>
  <text x="976" y="404" font-size="13" font-weight="700" letter-spacing="1" fill="#696969">BOOKS</text>
  <text x="976" y="438" font-size="15" font-weight="600" fill="#141413">Amazon DynamoDB</text>
  <text x="976" y="458" font-size="13" fill="#262627">on AWS, one item a shop</text>
  <text x="976" y="490" font-size="15" font-weight="600" fill="#141413">A JSON file a shop</text>
  <text x="976" y="510" font-size="13" fill="#262627">on your own computer</text>

  <text x="40" y="600" font-size="14" fill="#696969">The demo shop, its people and figures are invented. A confirmed purchase order is kept in the books; the demo sends nothing to a supplier.</text>
</svg>
